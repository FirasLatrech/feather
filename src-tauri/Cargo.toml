[package]
name = "feather"
version = "0.1.0"
description = "Feather — offline media compressor"
authors = ["Firas Latrach"]
edition = "2021"

[lib]
name = "feather_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "feather-cli"
path = "src/bin/feather-cli.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
which = "7"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
image = "0.25"
oxipng = { version = "9", default-features = false, features = ["parallel", "zopfli"] }
webp = "0.3"
ravif = "0.11"
rgb = "0.8"
filetime = "0.2"
regex = "1"
tauri-plugin-notification = "2"
notify = "8"
mozjpeg = "0.10"
clap = { version = "4", features = ["derive"] }
dirs = "6"

# Dev builds: keep our crate fast to compile but optimise dependencies (image/oxipng/ravif are 10-50x
# slower unoptimised — that's what makes `tauri dev` image compression feel slow).
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
